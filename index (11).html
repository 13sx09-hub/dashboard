<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>식단관리 현황 대시보드</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
  @font-face {
    font-family: 'Pretendard';
    src: url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/woff2/Pretendard-Regular.woff2') format('woff2');
    font-weight: 400;
  }
  @font-face {
    font-family: 'Pretendard';
    src: url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/woff2/Pretendard-Bold.woff2') format('woff2');
    font-weight: 700;
  }
  @font-face {
    font-family: 'Pretendard';
    src: url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/woff2/Pretendard-SemiBold.woff2') format('woff2');
    font-weight: 600;
  }

  :root {
    --bg-deep: #060b1a;
    --bg-panel: #0d1730;
    --bg-panel-2: #101d40;
    --cyan: #00e5ff;
    --cyan-dim: #00b8cc;
    --line: #1c2b52;
    --text-main: #e8edf9;
    --text-sub: #8a97bf;
    --amber: #ffb454;
    --violet: #a78bfa;
    --green: #34e37a;
    --green-dim: #1fae5c;
    --green-light: #9ff5c4;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Pretendard', -apple-system, sans-serif;
    background: radial-gradient(circle at 15% 0%, #0b1530 0%, var(--bg-deep) 55%);
    color: var(--text-main);
    padding: 32px 24px 60px;
    min-height: 100vh;
  }

  .wrap { max-width: 1080px; margin: 0 auto; }

  header {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    flex-wrap: wrap;
    gap: 16px;
    margin-bottom: 28px;
    padding-bottom: 20px;
    border-bottom: 1px solid var(--line);
  }

  .eyebrow {
    font-size: 12px;
    letter-spacing: 0.14em;
    color: var(--cyan);
    font-weight: 600;
    text-transform: uppercase;
    margin-bottom: 6px;
  }

  h1 {
    font-size: 24px;
    font-weight: 700;
    letter-spacing: -0.01em;
  }

  .subtitle {
    font-size: 13px;
    color: var(--text-sub);
    margin-top: 4px;
  }

  .meta-line {
    font-size: 12px;
    color: var(--cyan);
    margin-top: 8px;
    font-weight: 600;
  }

  .controls {
    display: flex;
    gap: 10px;
    align-items: center;
  }

  select, button {
    font-family: inherit;
    font-size: 13px;
    border-radius: 8px;
    padding: 9px 14px;
    border: 1px solid var(--line);
    background: var(--bg-panel);
    color: var(--text-main);
    cursor: pointer;
  }

  select {
    appearance: none;
    background-image: linear-gradient(45deg, transparent 50%, var(--cyan) 50%), linear-gradient(135deg, var(--cyan) 50%, transparent 50%);
    background-position: calc(100% - 16px) center, calc(100% - 11px) center;
    background-size: 5px 5px, 5px 5px;
    background-repeat: no-repeat;
    padding-right: 32px;
    min-width: 190px;
  }

  select:focus, button:focus-visible {
    outline: 2px solid var(--cyan);
    outline-offset: 1px;
  }

  #resetBtn {
    color: var(--cyan);
    border-color: var(--cyan-dim);
    font-weight: 600;
    transition: background 0.15s ease;
  }
  #resetBtn:hover { background: rgba(0,229,255,0.08); }

  .kpi-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
    gap: 14px;
    margin-bottom: 26px;
  }

  .kpi-card {
    background: linear-gradient(160deg, var(--bg-panel-2), var(--bg-panel));
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 18px 20px;
    position: relative;
    overflow: hidden;
  }
  .kpi-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 2px;
    background: linear-gradient(90deg, var(--cyan), transparent);
  }

  .kpi-label {
    font-size: 12px;
    color: var(--text-sub);
    font-weight: 600;
    margin-bottom: 8px;
  }

  .kpi-value {
    font-size: 28px;
    font-weight: 700;
    color: var(--cyan);
    letter-spacing: -0.01em;
    font-variant-numeric: tabular-nums;
  }

  .kpi-unit {
    font-size: 13px;
    color: var(--text-sub);
    font-weight: 500;
    margin-left: 4px;
  }

  .charts {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
  }

  @media (max-width: 760px) {
    body { padding: 20px 14px 40px; }
    .charts { grid-template-columns: 1fr; }
    header { align-items: flex-start; }
    h1 { font-size: 20px; }
    .controls { width: 100%; }
    .controls select { flex: 1; min-width: 0; }
    .controls button { flex-shrink: 0; }
    .kpi-grid { grid-template-columns: repeat(2, 1fr); gap: 10px; }
    .kpi-value { font-size: 22px; }
    .chart-panel { padding: 14px; }
    .chart-canvas-wrap { height: 220px; }
  }

  @media (max-width: 420px) {
    .kpi-grid { grid-template-columns: 1fr; }
    .meta-line { font-size: 11px; }
  }

  .chart-panel {
    background: var(--bg-panel);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 20px;
  }

  .chart-title {
    font-size: 14px;
    font-weight: 600;
    margin-bottom: 4px;
  }

  .chart-axis-note {
    font-size: 11px;
    color: var(--text-sub);
    margin-bottom: 14px;
  }

  .chart-canvas-wrap { position: relative; height: 260px; }

  .legend-row {
    display: flex;
    gap: 14px;
    flex-wrap: wrap;
    margin-top: 12px;
    font-size: 12px;
    color: var(--text-sub);
  }
  .legend-dot {
    display: inline-block;
    width: 9px; height: 9px;
    border-radius: 2px;
    margin-right: 6px;
    vertical-align: middle;
  }

  footer {
    margin-top: 24px;
    font-size: 11px;
    color: var(--text-sub);
    text-align: right;
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div>
      <div class="eyebrow">Dietitian Analytics</div>
      <h1>식단관리 현황 대시보드</h1>
      <div class="subtitle">환자 1,000명 · 식단 추천 유형별 BMI · 준수율 · 칼로리 현황</div>
      <div class="meta-line" id="metaLine">데이터 기간: 정보 없음(날짜 컬럼 미포함) · 총 건수: 1,000건 · 현재 필터: 전체</div>
    </div>
    <div class="controls">

  <section class="kpi-grid" id="kpiGrid" aria-label="핵심 지표"></section>

  <section class="charts">

      <div class="chart-canvas-wrap">

      </div>
    </div>
    <div class="chart-panel">

      </div>
    </div>
  </section>

  <footer>diet_recommendations_cleaned.csv 기반 · 총 1,000건</footer>
</div>

const COLORS = {
  cyan: '#00e5ff',
  amber: '#ffb454',
  violet: '#a78bfa',
  green: '#34e37a',
  greenDim: '#1fae5c',
  greenLight: '#9ff5c4',
  grid: 'rgba(255,255,255,0.06)',
  text: '#8a97bf'
};

const dietLabelKo = {
  'Balanced': '균형식',
  'Low_Carb': '저탄수화물',
  'Low_Sodium': '저나트륨'
};

let dietChart, bmiChart;
let currentFilter = 'all';

function getFiltered() {
  if (currentFilter === 'all') return RAW_DATA;
  return RAW_DATA.filter(r => r.Diet_Recommendation === currentFilter);
}

function avg(arr, key) {
  if (arr.length === 0) return 0;
  return arr.reduce((s, r) => s + r[key], 0) / arr.length;
}

function renderKPIs(rows) {
  const grid = document.getElementById('kpiGrid');
  const total = rows.length;
  const avgBMI = avg(rows, 'BMI');
  const avgAdherence = avg(rows, 'Adherence_to_Diet_Plan');
  const avgCalorie = avg(rows, 'Daily_Caloric_Intake');

  grid.innerHTML = `
    <div class="kpi-card">
      <div class="kpi-label">전체 환자 수</div>
      <div class="kpi-value">${total.toLocaleString()}<span class="kpi-unit">명</span></div>
    </div>
    <div class="kpi-card">
      <div class="kpi-label">평균 BMI</div>
      <div class="kpi-value">${avgBMI.toFixed(1)}</div>
    </div>
    <div class="kpi-card">
      <div class="kpi-label">평균 식단 준수율</div>
      <div class="kpi-value">${avgAdherence.toFixed(1)}<span class="kpi-unit">%</span></div>
    </div>
    <div class="kpi-card">
      <div class="kpi-label">평균 일일 칼로리 섭취량</div>
      <div class="kpi-value">${Math.round(avgCalorie).toLocaleString()}<span class="kpi-unit">kcal</span></div>
    </div>
  `;

  const filterLabel = currentFilter === 'all' ? '전체' : (dietLabelKo[currentFilter] || currentFilter);
  const metaLine = document.getElementById('metaLine');
  if (metaLine) {
    metaLine.textContent = `데이터 기간: 정보 없음(날짜 컬럼 미포함) · 총 건수: ${total.toLocaleString()}건 · 현재 필터: ${filterLabel}`;
  }
}

function renderDietChart(rows) {
  const counts = {};
  rows.forEach(r => { counts[r.Diet_Recommendation] = (counts[r.Diet_Recommendation] || 0) + 1; });
  const labels = Object.keys(counts);
  const values = labels.map(l => counts[l]);
  const total = values.reduce((a,b) => a+b, 0);
  const koLabels = labels.map(l => dietLabelKo[l] || l);

  const ctx = document.getElementById('dietChart').getContext('2d');
  if (dietChart) dietChart.destroy();
  dietChart = new Chart(ctx, {
    type: 'bar',
    data: {
      labels: koLabels,
      datasets: [{
        label: '환자 수',
        data: values,
        backgroundColor: [COLORS.green, COLORS.greenDim, COLORS.greenLight],
        borderRadius: 6,
        maxBarThickness: 64
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      plugins: {
        legend: { display: false },
        tooltip: {
          callbacks: {
            label: (ctx) => {
              const v = ctx.parsed.y;
              const pct = total ? ((v/total)*100).toFixed(1) : 0;
              return `${ctx.label}: ${v.toLocaleString()}명 (${pct}%)`;
            }
          }
        }
      },
      scales: {
        x: { grid: { display: false }, ticks: { color: COLORS.text } },
        y: {
          beginAtZero: true,
          grid: { color: COLORS.grid },
          ticks: { color: COLORS.text, precision: 0 },
          title: { display: true, text: '환자 수 (명)', color: COLORS.text }
        }
      }
    }
  });
}

function renderBmiChart(rows) {
  const bins = [10,15,20,25,30,35,40,45,50,55];
  const binLabels = [];
  const binCounts = new Array(bins.length - 1).fill(0);
  for (let i = 0; i < bins.length - 1; i++) {
    binLabels.push(`${bins[i]}-${bins[i+1]}`);
  }
  rows.forEach(r => {
    for (let i = 0; i < bins.length - 1; i++) {
      if (r.BMI >= bins[i] && r.BMI < bins[i+1]) { binCounts[i]++; break; }
      if (i === bins.length - 2 && r.BMI >= bins[i+1]) { binCounts[i]++; }
    }
  });
  const total = binCounts.reduce((a,b) => a+b, 0);

  const ctx = document.getElementById('bmiChart').getContext('2d');
  if (bmiChart) bmiChart.destroy();
  bmiChart = new Chart(ctx, {
    type: 'bar',
    data: {
      labels: binLabels,
      datasets: [{
        label: '환자 수',
        data: binCounts,
        backgroundColor: COLORS.cyan,
        borderRadius: 4,
        categoryPercentage: 1.0,
        barPercentage: 0.95
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      plugins: {
        legend: { display: false },
        tooltip: {
          callbacks: {
            label: (ctx) => {
              const v = ctx.parsed.y;
              const pct = total ? ((v/total)*100).toFixed(1) : 0;
              return `BMI ${ctx.label}: ${v.toLocaleString()}명 (${pct}%)`;
            }
          }
        }
      },
      scales: {
        x: {
          grid: { display: false },
          ticks: { color: COLORS.text },
          title: { display: true, text: 'BMI 구간', color: COLORS.text }
        },
        y: {
          beginAtZero: true,
          grid: { color: COLORS.grid },
          ticks: { color: COLORS.text, precision: 0 },
          title: { display: true, text: '환자 수 (명)', color: COLORS.text }
        }
      }
    }
  });
}

function renderAll() {
  const rows = getFiltered();
  renderKPIs(rows);
  renderDietChart(rows);
  renderBmiChart(rows);
}

function init() {
  const uniqueDiets = [...new Set(RAW_DATA.map(r => r.Diet_Recommendation))];
  const select = document.getElementById('dietFilter');
  uniqueDiets.forEach(d => {
    const opt = document.createElement('option');
    opt.value = d;
    opt.textContent = dietLabelKo[d] || d;
    select.appendChild(opt);
  });

  select.addEventListener('change', (e) => {
    currentFilter = e.target.value;
    renderAll();
  });

  document.getElementById('resetBtn').addEventListener('click', () => {
    currentFilter = 'all';
    select.value = 'all';
    renderAll();
  });

  renderAll();
}

init();
</script>
